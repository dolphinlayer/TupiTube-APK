<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TupiTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Premium Turuncu & Koyu Tema Özelleştirmeleri */
        body {
            background-color: #0d0d0d;
            color: #e5e5e5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .orange-glow {
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.2);
        }
        /* Gizli Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col relative pb-10">

    <!-- TOP BAR (Logo ve Arama) -->
    <header class="sticky top-0 bg-[#141414] p-4 border-b border-[#262626] z-40 orange-glow">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center space-x-2">
                <img src="tupi1.jpg" alt="Logo" class="h-8 w-auto object-contain rounded">
                <span class="text-xl font-bold tracking-wider text-white">Tupi<span class="text-[#FF6B00]">Tube</span></span>
            </div>
        </div>
        <div class="flex space-x-2">
            <input type="text" id="searchInput" placeholder="Video adı veya YouTube URL yapıştır..." 
                   class="flex-1 bg-[#1f1f1f] border border-[#333] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF6B00] transition">
            <button onclick="handleSearch()" class="bg-[#FF6B00] text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-[#e05e00] active:scale-95 transition">
                Ara
            </button>
        </div>
    </header>

    <!-- MAIN PLAYER AREA -->
    <main class="flex-1 p-4 space-y-4">
        <!-- Video Oynatıcı Kutusu -->
        <div class="bg-[#141414] rounded-xl overflow-hidden border border-[#262626]">
            <video id="mainPlayer" controls class="w-full aspect-video bg-black"></video>
            <div class="p-3">
                <h2 id="videoTitle" class="text-base font-semibold text-white line-clamp-2">Henüz bir video oynatılmıyor</h2>
                
                <!-- Aksiyon Butonları (İndir) -->
                <div class="flex justify-end mt-3 pt-2 border-t border-[#262626]">
                    <button id="downloadBtn" onclick="downloadCurrentVideo()" class="hidden items-center space-x-2 bg-[#262626] border border-[#333] text-[#FF6B00] px-4 py-1.5 rounded-full text-xs font-medium hover:bg-[#333] transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="box-shadow 0 19 9l-7 7-7-7m14 6v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8"></path></svg>
                        <span>Cihaza İndir</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ARAMA SONUÇLARI -->
        <section id="searchResultsSection" class="hidden space-y-3">
            <h3 class="text-sm font-bold text-[#FF6B00] uppercase tracking-wider">Arama Sonuçları</h3>
            <div id="searchResults" class="space-y-3"></div>
        </section>

        <!-- GEÇMİŞ VİDEOLAR -->
        <section class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider">İzleme Geçmişi</h3>
                <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline">Temizle</button>
            </div>
            <div id="historyList" class="space-y-3"></div>
        </section>
    </main>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center space-y-4">
        <img src="tupi2.jpg" alt="Yükleniyor" class="w-16 h-16 object-contain animate-spin rounded-full border-2 border-[#FF6B00]">
        <p class="text-sm text-gray-400 font-medium">Video çözülüyor, bekle bra...</p>
    </div>

    <!-- JAVASCRIPT MANTIĞI -->
    <script>
        const BACKEND_URL = 'http://localhost:3000';
        let currentStreamUrl = '';
        let currentVideoTitle = '';

        // Sayfa açıldığında geçmişi yükle
        document.addEventListener('DOMContentLoaded', renderHistory);

        // Arama veya URL tetikleyici ana fonksiyon
        async function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            // Eğer girilen değer direkt YouTube linkiyse
            if (query.includes('youtube.com/') || query.includes('youtu.be/')) {
                fetchAndPlay(query, "Doğrudan URL Videosu");
            } else {
                // Kelime girildiyse arama yap
                showLoading(true);
                try {
                    const res = await fetch(`${BACKEND_URL}/search?q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    renderSearchResults(data.videos || []);
                } catch (err) {
                    alert('Backend bağlantısı başarısız bra! Termux açık mı?');
                } finally {
                    showLoading(false);
                }
            }
        }

        // Arama Sonuçlarını Listeleme
        function renderSearchResults(videos) {
            const container = document.getElementById('searchResults');
            const section = document.getElementById('searchResultsSection');
            container.innerHTML = '';

            if (videos.length === 0) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            videos.forEach(video => {
                const item = document.createElement('div');
                item.className = 'flex space-x-3 bg-[#141414] p-2 rounded-lg border border-[#262626] cursor-pointer hover:border-[#FF6B00] transition';
                item.onclick = () => fetchAndPlay(video.url, video.title, video.thumbnail);
                item.innerHTML = `
                    <div class="relative w-32 aspect-video bg-black rounded overflow-hidden flex-shrink-0">
                        <img src="${video.thumbnail}" class="w-full h-full object-cover">
                        <span class="absolute bottom-1 right-1 bg-black/80 text-[10px] px-1 rounded text-white">${video.duration || '00:00'}</span>
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <h4 class="text-sm font-medium text-white line-clamp-2 leading-tight">${video.title}</h4>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Videoyu Backend'den Çekip Oynatma ve Geçmişe Ekleme
        async function fetchAndPlay(url, title, thumbnail = 'tupi1.jpg') {
            showLoading(true);
            try {
                const res = await fetch(`${BACKEND_URL}/stream?url=${encodeURIComponent(url)}`);
                const data = await res.json();

                if (data.streamUrl) {
                    currentStreamUrl = data.streamUrl;
                    currentVideoTitle = title;

                    const player = document.getElementById('mainPlayer');
                    player.src = data.streamUrl;
                    player.play();

                    document.getElementById('videoTitle').innerText = title;
                    document.getElementById('downloadBtn').classList.remove('hidden');
                    document.getElementById('downloadBtn').classList.add('flex');

                    // Geçmişe kaydet
                    saveToHistory({ title, url, thumbnail });
                } else {
                    alert('Video adresi alınamadı.');
                }
            } catch (err) {
                alert('Akış çekilirken hata oluştu.');
            } finally {
                showLoading(false);
            }
        }

        // Cihaza İndirme Butonu Mantığı
        function downloadCurrentVideo() {
            if (!currentStreamUrl) return;
            // Tarayıcı/Uygulama üzerinden indirmeyi tetikler
            const a = document.createElement('a');
            a.href = currentStreamUrl;
            a.download = `${currentVideoTitle || 'video'}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // LocalStorage ile İzleme Geçmişi Yönetimi
        function saveToHistory(video) {
            let history = JSON.parse(localStorage.getItem('tupi_history')) || [];
            // Aynı video varsa listeden eski halini sil (en başa gelsin)
            history = history.filter(item => item.url !== video.url);
            history.unshift(video);
            // Sınır: Son 10 videoyu tut
            if (history.length > 10) history.pop();
            localStorage.setItem('tupi_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('tupi_history')) || [];

            if (history.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500 italic">Henüz izleme geçmişi yok bra.</p>';
                return;
            }

            history.forEach(video => {
                const item = document.createElement('div');
                item.className = 'flex space-x-3 bg-[#111] p-2 rounded-lg border border-[#1f1f1f] cursor-pointer hover:border-gray-600 transition';
                item.onclick = () => fetchAndPlay(video.url, video.title, video.thumbnail);
                item.innerHTML = `
                    <img src="${video.thumbnail}" class="w-20 aspect-video object-cover bg-black rounded flex-shrink-0">
                    <div class="flex-1 min-w-0 flex items-center">
                        <h4 class="text-xs text-gray-300 line-clamp-2 leading-snug">${video.title}</h4>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function clearHistory() {
            localStorage.removeItem('tupi_history');
            renderHistory();
        }

        function showLoading(status) {
            const overlay = document.getElementById('loadingOverlay');
            if (status) overlay.classList.remove('hidden');
            else overlay.classList.add('hidden');
        }
    </script>
</body>
</html>
